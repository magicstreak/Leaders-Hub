<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaders Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2d5b3e;
      --primary-hover: #234a31;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --amber-bg: #fef3c7;
      --amber-text: #92400e;
      --green-bg: #dcfce7;
      --green-text: #166534;
      --red: #b91c1c;
      --radius-panel: 14px;
      --radius-card: 10px;
      --shadow-panel: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --shadow-float: 0 16px 32px -8px rgba(15, 23, 42, 0.25);
    }
    * { box-sizing: border-box; }

    body {
      font-family: "Google Sans", system-ui, -apple-system, sans-serif;
      background: #f6f5f0;
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page { width: 100%; max-width: 1100px; }
    .page-header { text-align: center; margin-bottom: 24px; }
    .page-header h1 { margin: 0 0 6px; font-size: 1.8rem; color: var(--primary); }
    .page-header p { margin: 0; color: var(--text-muted); }

    .panel {
      background: #fff;
      border-radius: var(--radius-panel);
      box-shadow: var(--shadow-panel);
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .toolbar-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .toolbar input[type="search"], .toolbar select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      min-width: 200px;
    }

    .btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { color: var(--red); border-color: #fca5a5; }
    .btn-small { padding: 4px 10px; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      margin-bottom: 16px;
      background: var(--bg-muted, #f8fafc);
    }
    .card h2 { margin: 0 0 10px; font-size: 1.05rem; color: var(--primary); }
    .request-item { padding: 10px 0; border-top: 1px solid var(--border); }
    .request-item:first-of-type { border-top: none; }
    .request-item .who { font-weight: 600; }
    .request-item .meta { color: var(--text-muted); font-size: 0.85rem; margin: 2px 0 6px; }
    .change-list { margin: 0 0 8px; padding-left: 18px; font-size: 0.9rem; }
    .change-list li { margin-bottom: 2px; }
    .request-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .table-wrap { overflow-x: auto; }
    .leaders-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    .leaders-table th, .leaders-table td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      white-space: nowrap;
    }
    .leaders-table th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .leaders-table tr.is-me td { background: #f0f9f3; }
    .leaders-table a { color: var(--primary); }
    .id-cell { font-variant-numeric: tabular-nums; color: var(--text-muted); }
    .muted { color: var(--text-muted); }

    .pill {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .pill-whatsapp { background: var(--green-bg); color: var(--green-text); }
    .pill-pending { background: var(--amber-bg); color: var(--amber-text); }
    .pill-approved { background: var(--green-bg); color: var(--green-text); }
    .pill-rejected { background: #fee2e2; color: var(--red); }

    .empty { text-align: center; color: var(--text-muted); padding: 24px 0; }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal[hidden] { display: none; }
    .modal-card {
      background: #fff;
      color: var(--text);
      border-radius: var(--radius-panel);
      box-shadow: var(--shadow-float);
      padding: 22px;
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-card h2 { margin: 0 0 4px; color: var(--primary); }
    .modal-card .lede { margin: 0 0 16px; color: var(--text-muted); font-size: 0.9rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-field input, .form-field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }
    .form-field input:disabled { background: #f1f5f9; color: var(--text-muted); }
    .form-field .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }
    .form-error {
      margin: 12px 0 0;
      color: var(--red);
      font-size: 0.9rem;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

    /* Phone: stack the form and let the table scroll sideways */
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .toolbar input[type="search"], .toolbar select { min-width: 0; width: 100%; }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="page-header">
      <h1 id="page-title">Leaders Database</h1>
      <p id="page-subtitle"></p>
    </header>

    <main class="panel">
      <div class="toolbar">
        <div class="toolbar-group">
          <input type="search" id="search" placeholder="Search name, ID or email" aria-label="Search leaders" />
          <div id="picker-wrap" class="toolbar-group" hidden>
            <label for="leader-picker" class="muted">I am</label>
            <select id="leader-picker" aria-label="Choose your name"></select>
          </div>
        </div>
        <div class="toolbar-group">
          <button type="button" class="btn btn-primary" id="add-leader" hidden>+ Add leader</button>
        </div>
      </div>

      <section class="card" id="pending-panel" hidden>
        <h2>Change requests waiting for approval <span class="muted" id="pending-count"></span></h2>
        <div id="pending-list"></div>
      </section>

      <section class="card" id="my-requests-panel" hidden>
        <h2>My change requests</h2>
        <div id="my-requests-list"></div>
      </section>

      <div class="table-wrap">
        <table class="leaders-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Phone 1</th>
              <th>Phone 2</th>
              <th>Email</th>
              <th>WhatsApp</th>
              <th>Linked leader</th>
              <th class="actions-col" id="actions-head" hidden></th>
            </tr>
          </thead>
          <tbody id="leaders-body"></tbody>
        </table>
      </div>
      <p class="empty" id="empty-note" hidden>No leaders match your search.</p>
    </main>
  </div>

  <!-- Add / edit / request-change dialog -->
  <div class="modal" id="leader-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p class="lede" id="modal-lede"></p>
      <form id="leader-form" novalidate>
        <div class="form-grid" id="form-fields"></div>
        <p class="form-error" id="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    /* ========================================================= SETUP ========================================================= */
    // Same Firebase project as the Walk Scheduler: reads walk_bookings for delete checks, reads/writes leaders and leader_requests.
    const firebaseConfig = {
      apiKey: "AIzaSyC0hEmdWHSlBkdnxrQiNt_RITYsbj3wvi0",
      authDomain: "cbmw-walk-scheduler.firebaseapp.com",
      databaseURL: "https://cbmw-walk-scheduler-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "cbmw-walk-scheduler",
      storageBucket: "cbmw-walk-scheduler.firebasestorage.app",
      messagingSenderId: "108766389213",
      appId: "1:108766389213:web:cded7ada3d32874b380c34",
      measurementId: "G-QFS6HHL007"
    };

    // View comes from the hosting page: ?view=walker | leader | admin (default walker).
    // Leader view also takes ?leader_id=101 so the page knows who is asking. Without it, the leader picks their name.
    const params = new URLSearchParams(window.location.search);
    const VIEW = (() => {
      const v = params.get("view") || window.LEADERS_VIEW || "walker";
      return ["walker", "leader", "admin"].includes(v) ? v : "walker";
    })();
    const isAdmin = VIEW === "admin";
    const isLeader = VIEW === "leader";
    let myLeaderId = isLeader ? (params.get("leader_id") || "") : "";

    let db = null;
    let leaders = [];          // sorted by leader_id
    let requests = {};         // leader_requests/{id}
    let bookings = {};         // walk_bookings (read only, used for delete checks)

    /* ========================================================= HELPERS ========================================================= */
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    const EDITABLE_FIELDS = [
      { key: "first_name", label: "First name", required: true },
      { key: "surname", label: "Surname", required: true },
      { key: "phone_1", label: "Phone 1", type: "tel", required: true },
      { key: "phone_2", label: "Phone 2", type: "tel" },
      { key: "email_add", label: "Email", type: "email", required: true },
      { key: "whats_app", label: "WhatsApp preferred", type: "whatsapp", required: true },
      { key: "linked_leader", label: "Linked leader", type: "leader", hint: "Another leader's ID, e.g. a co-leader" },
    ];
    const ID_FIELD = { key: "leader_id", label: "Leader ID", required: true };
    const CHANGE_LABELS = Object.fromEntries([ID_FIELD, ...EDITABLE_FIELDS].map((f) => [f.key, f.label]));

    const leaderById = (id) => leaders.find((l) => l.leader_id === id) || null;
    const fullName = (l) => (l ? `${l.first_name || ""} ${l.surname || ""}`.trim() : "");
    const str = (v) => String(v ?? "").trim();
    const pendingFor = (id) => Object.values(requests).filter((r) => r && r.status === "pending" && r.leader_id === id);
    const pendingRequests = () => Object.values(requests).filter((r) => r && r.status === "pending")
      .sort((a, b) => String(a.requested_at).localeCompare(String(b.requested_at)));

    function nextLeaderId() {
      const max = leaders.reduce((m, l) => Math.max(m, Number(l.leader_id) || 0), 100);
      return String(max + 1);
    }

    // Walk bookings that point at this leader, by ID or (older bookings) by name
    function bookingCountFor(leader) {
      const name = fullName(leader);
      return Object.values(bookings).filter(Boolean).filter((b) =>
        b.leader_id ? b.leader_id === leader.leader_id : (b.leader_name && b.leader_name === name)
      ).length;
    }
    function linkedFromCount(leader) {
      return leaders.filter((l) => l.linked_leader === leader.leader_id).length;
    }

    /* ========================================================= RENDER ========================================================= */
    function setupPage() {
      const titles = {
        walker: ["Leaders Database", "Read-only directory of leaders."],
        leader: ["Leaders Database", "You can request changes to your own details. An admin approves each change."],
        admin: ["Leaders Database", "Add, edit or remove leaders, and approve or reject change requests from leaders."],
      };
      document.getElementById("page-title").textContent = titles[VIEW][0];
      document.getElementById("page-subtitle").textContent = titles[VIEW][1];
      document.getElementById("add-leader").hidden = !isAdmin;
      document.getElementById("actions-head").hidden = !isAdmin;
      document.getElementById("pending-panel").hidden = !isAdmin;
      document.getElementById("picker-wrap").hidden = !isLeader || !!params.get("leader_id");
    }

    function renderPicker() {
      if (!isLeader) return;
      const select = document.getElementById("leader-picker");
      const current = myLeaderId;
      select.innerHTML = `<option value="" ${current ? "" : "selected"} disabled>Choose your name</option>` +
        leaders.map((l) => `<option value="${escapeHtml(l.leader_id)}" ${l.leader_id === current ? "selected" : ""}>${escapeHtml(fullName(l))} (${escapeHtml(l.leader_id)})</option>`).join("");
    }

    function renderTable() {
      const term = str(document.getElementById("search").value).toLowerCase();
      const rows = leaders.filter((l) => {
        if (!term) return true;
        return [l.leader_id, fullName(l), l.email_add, l.phone_1, l.phone_2].join(" ").toLowerCase().includes(term);
      });
      document.getElementById("empty-note").hidden = rows.length > 0;

      document.getElementById("leaders-body").innerHTML = rows.map((l) => {
        const linked = leaderById(l.linked_leader);
        const mine = isLeader && l.leader_id === myLeaderId;
        const waiting = pendingFor(l.leader_id).length > 0;

        let actions = "";
        if (isAdmin) {
          actions = `<button type="button" class="btn btn-small" data-action="edit" data-id="${escapeHtml(l.leader_id)}">Edit</button>
            <button type="button" class="btn btn-small btn-danger" data-action="delete" data-id="${escapeHtml(l.leader_id)}">Delete</button>`;
        }
        // Leader view: the request button sits beside the leader's own name, so it shows without scrolling
        const requestBtn = mine
          ? ` <button type="button" class="btn btn-small" data-action="request" data-id="${escapeHtml(l.leader_id)}">Request change</button>`
          : "";

        return `<tr class="${mine ? "is-me" : ""}">
          <td class="id-cell">${escapeHtml(l.leader_id)}</td>
          <td>${escapeHtml(fullName(l))}${mine ? ` <span class="muted">(you)</span>` : ""}${waiting ? ` <span class="pill pill-pending">Change pending</span>` : ""}${requestBtn}</td>
          <td>${l.phone_1 ? `<a href="tel:${escapeHtml(l.phone_1.replace(/[^\d+]/g, ""))}">${escapeHtml(l.phone_1)}</a>` : "–"}</td>
          <td>${l.phone_2 ? `<a href="tel:${escapeHtml(l.phone_2.replace(/[^\d+]/g, ""))}">${escapeHtml(l.phone_2)}</a>` : "–"}</td>
          <td>${l.email_add ? `<a href="mailto:${escapeHtml(l.email_add)}">${escapeHtml(l.email_add)}</a>` : "–"}</td>
          <td>${l.whats_app === "y" ? `<span class="pill pill-whatsapp">WhatsApp</span>` : ""}</td>
          <td>${linked ? `${escapeHtml(fullName(linked))} <span class="muted">(${escapeHtml(linked.leader_id)})</span>` : (l.linked_leader ? `<span class="muted">${escapeHtml(l.linked_leader)} (missing)</span>` : "–")}</td>
          ${isAdmin ? `<td class="actions-cell">${actions}</td>` : ""}
        </tr>`;
      }).join("");

      renderPicker();
    }

    function changeListHtml(request) {
      return `<ul class="change-list">${Object.entries(request.changes || {}).map(([key, after]) => {
        const before = request.before?.[key];
        return `<li><strong>${escapeHtml(CHANGE_LABELS[key] || key)}:</strong> ${escapeHtml(before || "(blank)")} → ${escapeHtml(after || "(blank)")}</li>`;
      }).join("")}</ul>`;
    }

    function renderPending() {
      if (!isAdmin) return;
      const list = pendingRequests();
      document.getElementById("pending-count").textContent = list.length ? `(${list.length})` : "";
      document.getElementById("pending-list").innerHTML = list.length ? list.map((r) => {
        const who = leaderById(r.leader_id);
        return `<div class="request-item">
          <div class="who">${escapeHtml(fullName(who) || "Unknown leader")} <span class="muted">(ID ${escapeHtml(r.leader_id)})</span></div>
          <div class="meta">Requested ${escapeHtml(formatDate(r.requested_at))}</div>
          ${changeListHtml(r)}
          <div class="request-actions">
            <button type="button" class="btn btn-small btn-primary" data-action="approve" data-request="${escapeHtml(r.request_id)}">Approve</button>
            <button type="button" class="btn btn-small btn-danger" data-action="reject" data-request="${escapeHtml(r.request_id)}">Reject</button>
          </div>
        </div>`;
      }).join("") : `<p class="empty" style="padding:8px 0">No change requests waiting.</p>`;
    }

    function renderMyRequests() {
      const panel = document.getElementById("my-requests-panel");
      if (!isLeader || !myLeaderId) { panel.hidden = true; return; }
      const mine = Object.values(requests).filter((r) => r && r.leader_id === myLeaderId)
        .sort((a, b) => String(b.requested_at).localeCompare(String(a.requested_at)));
      panel.hidden = mine.length === 0;
      document.getElementById("my-requests-list").innerHTML = mine.map((r) => `
        <div class="request-item">
          <div class="meta">Requested ${escapeHtml(formatDate(r.requested_at))}
            <span class="pill pill-${escapeHtml(r.status)}">${escapeHtml(statusLabel(r.status))}</span></div>
          ${changeListHtml(r)}
          ${r.status === "rejected" && r.reason ? `<div class="meta">Reason: ${escapeHtml(r.reason)}</div>` : ""}
        </div>`).join("");
    }

    function statusLabel(status) {
      return { pending: "Waiting for approval", approved: "Approved", rejected: "Not approved" }[status] || status;
    }
    function formatDate(iso) {
      const d = new Date(iso);
      return isNaN(d) ? "" : d.toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function renderAll() {
      renderTable();
      renderPending();
      renderMyRequests();
    }

    /* ========================================================= DIALOG ========================================================= */
    const modal = document.getElementById("leader-modal");
    const form = document.getElementById("leader-form");
    let dialogMode = null;     // "create" | "edit" | "request"
    let dialogLeader = null;   // leader being edited or requested

    function fieldHtml(field, value, disabled) {
      const id = `f-${field.key}`;
      const val = escapeHtml(value ?? "");
      let control;
      if (field.type === "whatsapp") {
        control = `<select id="${id}" name="${field.key}"><option value="n" ${value !== "y" ? "selected" : ""}>No</option><option value="y" ${value === "y" ? "selected" : ""}>Yes</option></select>`;
      } else if (field.type === "leader") {
        const options = leaders
          .filter((l) => !dialogLeader || l.leader_id !== dialogLeader.leader_id)
          .map((l) => `<option value="${escapeHtml(l.leader_id)}" ${l.leader_id === value ? "selected" : ""}>${escapeHtml(fullName(l))} (${escapeHtml(l.leader_id)})</option>`).join("");
        control = `<select id="${id}" name="${field.key}"><option value="">None</option>${options}</select>`;
      } else {
        const type = field.type || "text";
        control = `<input id="${id}" name="${field.key}" type="${type}" value="${val}" ${disabled ? "disabled" : ""} autocomplete="off" />`;
      }
      return `<div class="form-field ${field.type === "leader" || field.key === "email_add" ? "full" : ""}">
        <label for="${id}">${escapeHtml(field.label)}${field.required ? " *" : ""}</label>
        ${control}
        ${field.hint ? `<div class="hint">${escapeHtml(field.hint)}</div>` : ""}
      </div>`;
    }

    function openDialog(mode, leader = null) {
      dialogMode = mode;
      dialogLeader = leader;
      const title = document.getElementById("modal-title");
      const lede = document.getElementById("modal-lede");
      const submit = document.getElementById("modal-submit");
      const error = document.getElementById("form-error");
      error.hidden = true;
      error.textContent = "";

      let fields = [];
      if (mode === "create") {
        title.textContent = "Add leader";
        lede.textContent = "Creates a new leader in the database.";
        submit.textContent = "Add leader";
        fields = [ID_FIELD, ...EDITABLE_FIELDS];
      } else if (mode === "edit") {
        title.textContent = `Edit ${fullName(leader)}`;
        lede.textContent = "Changes apply straight away.";
        submit.textContent = "Save changes";
        fields = [ID_FIELD, ...EDITABLE_FIELDS];
      } else {
        title.textContent = `Request a change for ${fullName(leader)}`;
        lede.textContent = "Your changes are sent to an admin for approval. Your details stay the same until then.";
        submit.textContent = "Send request";
        fields = EDITABLE_FIELDS;
      }

      document.getElementById("form-fields").innerHTML = fields.map((f) => {
        const value = mode === "create"
          ? (f.key === "leader_id" ? nextLeaderId() : (f.key === "whats_app" ? "n" : ""))
          : leader?.[f.key] ?? "";
        return fieldHtml(f, value, f.key === "leader_id" && mode === "edit");
      }).join("");
      modal.hidden = false;
      document.getElementById(mode === "create" ? "f-leader_id" : "f-first_name")?.focus();
    }

    function closeDialog() {
      modal.hidden = true;
      dialogMode = null;
      dialogLeader = null;
    }

    function showError(message) {
      const error = document.getElementById("form-error");
      error.textContent = message;
      error.hidden = false;
    }

    // Reads and checks the form; returns the cleaned record or null (after showing an error)
    function readForm(mode) {
      const get = (key) => str(form.elements[key]?.value);
      const record = {};
      if (mode !== "request") record.leader_id = get("leader_id");
      for (const f of EDITABLE_FIELDS) record[f.key] = get(f.key);
      if (record.whats_app !== "y") record.whats_app = "n";

      if (mode !== "request") {
        if (!/^\d+$/.test(record.leader_id)) return showError("Leader ID must be a number."), null;
        if (mode === "create" && leaderById(record.leader_id)) return showError(`Leader ID ${record.leader_id} is already used.`), null;
      }
      for (const f of [...(mode === "request" ? [] : [ID_FIELD]), ...EDITABLE_FIELDS]) {
        if (f.required && !record[f.key]) return showError(`${f.label} is required.`), null;
      }
      if (!/^[+\d][\d\s()-]{5,}$/.test(record.phone_1)) return showError("Phone 1 should be a phone number."), null;
      if (record.phone_2 && !/^[+\d][\d\s()-]{5,}$/.test(record.phone_2)) return showError("Phone 2 should be a phone number, or left blank."), null;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(record.email_add)) return showError("Email does not look valid."), null;
      if (record.linked_leader) {
        const selfId = mode === "request" ? dialogLeader.leader_id : record.leader_id;
        if (record.linked_leader === selfId) return showError("A leader cannot be linked to themselves."), null;
        if (!leaderById(record.linked_leader)) return showError("The linked leader does not exist."), null;
      }
      return record;
    }

    /* ========================================================= ACTIONS ========================================================= */
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!dialogMode || !db) return;
      const mode = dialogMode;
      const record = readForm(mode);
      if (!record) return;

      try {
        if (mode === "create" || mode === "edit") {
          await set(ref(db, "leaders/" + record.leader_id), record);
        } else {
          const current = dialogLeader;
          const changes = {};
          const before = {};
          for (const f of EDITABLE_FIELDS) {
            const was = f.key === "whats_app" ? (current.whats_app === "y" ? "y" : "n") : str(current[f.key]);
            if (record[f.key] !== was) {
              changes[f.key] = record[f.key];
              before[f.key] = was;
            }
          }
          if (!Object.keys(changes).length) return showError("No changes to send. Change a field first."), undefined;
          if (pendingFor(current.leader_id).length) {
            return showError("You already have a change waiting for approval. Ask an admin to review it first."), undefined;
          }
          const requestId = `${current.leader_id}_${Date.now()}`;
          await set(ref(db, "leader_requests/" + requestId), {
            request_id: requestId,
            leader_id: current.leader_id,
            status: "pending",
            requested_at: new Date().toISOString(),
            changes,
            before,
          });
        }
        closeDialog();
      } catch (err) {
        console.error("Save failed:", err);
        showError("Could not save. Check the database connection and permissions.");
      }
    });

    document.getElementById("modal-cancel").addEventListener("click", closeDialog);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeDialog(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closeDialog(); });

    document.getElementById("add-leader").addEventListener("click", () => openDialog("create"));
    document.getElementById("search").addEventListener("input", renderTable);

    document.getElementById("leader-picker").addEventListener("change", (e) => {
      myLeaderId = e.target.value;
      renderAll();
    });

    // Row buttons (edit, delete, request change)
    document.getElementById("leaders-body").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const leader = leaderById(btn.dataset.id);
      if (!leader) return;

      if (btn.dataset.action === "edit" && isAdmin) openDialog("edit", leader);
      if (btn.dataset.action === "request" && isLeader) openDialog("request", leader);
      if (btn.dataset.action === "delete" && isAdmin) {
        const usedBy = bookingCountFor(leader);
        const linkedBy = linkedFromCount(leader);
        const notes = [];
        if (usedBy) notes.push(`${usedBy} walk booking(s) use this leader. Their name stays on the booking, but the contact details will no longer show.`);
        if (linkedBy) notes.push(`${linkedBy} leader(s) are linked to this leader. Their link will show as missing.`);
        const message = `Delete ${fullName(leader)} (ID ${leader.leader_id})?${notes.length ? "\n\n" + notes.join("\n") : ""}`;
        if (!confirm(message)) return;
        try {
          await remove(ref(db, "leaders/" + leader.leader_id));
        } catch (err) {
          console.error("Delete failed:", err);
          alert("Could not delete. Check the database permissions.");
        }
      }
    });

    // Pending request buttons (admin)
    document.getElementById("pending-list").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn || !isAdmin) return;
      const request = requests[btn.dataset.request];
      if (!request || request.status !== "pending") return;

      try {
        if (btn.dataset.action === "approve") {
          const leader = leaderById(request.leader_id);
          if (!leader) return alert("This leader no longer exists, so the change cannot be applied. Reject the request instead.");
          if (!confirm(`Approve this change for ${fullName(leader)}?`)) return;
          await update(ref(db, "leaders/" + request.leader_id), request.changes);
          await update(ref(db, "leader_requests/" + request.request_id), {
            status: "approved",
            reviewed_at: new Date().toISOString(),
          });
        }
        if (btn.dataset.action === "reject") {
          const reason = prompt("Reason for rejecting (optional):", "");
          if (reason === null) return;
          await update(ref(db, "leader_requests/" + request.request_id), {
            status: "rejected",
            reason: str(reason),
            reviewed_at: new Date().toISOString(),
          });
        }
      } catch (err) {
        console.error("Review failed:", err);
        alert("Could not update the request. Check the database permissions.");
      }
    });

    /* ========================================================= DATA ========================================================= */
    function start() {
      setupPage();
      if (!db) {
        document.getElementById("leaders-body").innerHTML = `<tr><td colspan="8" class="empty">The database could not be reached.</td></tr>`;
        return;
      }
      onValue(ref(db, "leaders"), (snapshot) => {
        const data = snapshot.val() || {};
        leaders = Object.values(data).filter(Boolean)
          .sort((a, b) => Number(a.leader_id) - Number(b.leader_id));
        renderAll();
      }, (error) => console.error("Unable to load leaders:", error));

      onValue(ref(db, "leader_requests"), (snapshot) => {
        requests = snapshot.val() || {};
        renderAll();
      }, (error) => console.error("Unable to load change requests:", error));

      // Read only: used to warn before a leader is deleted
      onValue(ref(db, "walk_bookings"), (snapshot) => {
        bookings = snapshot.val() || {};
      }, (error) => console.error("Unable to load bookings:", error));
    }

    try {
      const app = initializeApp(firebaseConfig, "leadersApp");
      db = getDatabase(app);
      const auth = getAuth(app);
      signInAnonymously(auth).then(start).catch((err) => {
        console.error("Anonymous sign-in failed:", err);
        start();
      });
    } catch (err) {
      console.error("Leaders Firebase startup failed.", err);
      start();
    }
  </script>
</body>

</html>
